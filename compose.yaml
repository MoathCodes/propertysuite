# Property Suite with Docker Compose, for a laptop or home server.
#
#   docker compose up -d
#   docker compose logs propertysuite     # shows the one-time setup link
#
# To update when the System page says a new version is out: change the
# version in `image:` below (or keep `latest`), then
#   docker compose pull && docker compose up -d
# Your data stays in the propertysuite-data volume.
services:
  propertysuite:
    image: ${PS_IMAGE:-ghcr.io/moathcodes/propertysuite:latest}
    restart: unless-stopped
    ports:
      - "${PS_HTTP_PORT:-8080}:8080"
    environment:
      PS_BASE_URL: ${PS_BASE_URL:-http://localhost:8080}
      PS_FEED_URL: ${PS_FEED_URL:-https://github.com/MoathCodes/propertysuite/releases/latest/download/feed.json}
    volumes:
      - propertysuite-data:/data

volumes:
  propertysuite-data:
